<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Social link-preview card (1200x630) for public/og-image.png.
  Edit the text/numbers below if they change (years, project count, certs),
  then regenerate with:  npm run og:image
-->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f7f1; --card: #fdfcf8; --fg: #1d2130; --muted: #5d6170;
    --border: #dcd8cd; --accent: #b4521c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgb(29 33 48 / .05) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(29 33 48 / .05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  svg.bg { position: absolute; right: 0; bottom: 0; }
  .wrap { position: relative; display: flex; height: 100%; padding: 64px 72px; gap: 56px; align-items: center; }
  .left { flex: 1; min-width: 0; }
  .logo { font-size: 26px; font-weight: 700; }
  .logo span { color: var(--accent); }
  h1 { margin-top: 34px; font-size: 76px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .role { margin-top: 16px; font-size: 28px; color: var(--muted); }
  .kpis {
    margin-top: 36px; display: inline-grid; grid-template-columns: repeat(3, auto);
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--card);
  }
  .kpi { padding: 14px 26px; text-align: center; }
  .kpi + .kpi { border-left: 1.5px solid var(--border); }
  .kpi b { display: block; font-size: 34px; }
  .kpi small { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .foot { margin-top: 34px; display: flex; align-items: center; gap: 22px; font-size: 20px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px;
          background: var(--fg); color: var(--bg); font-weight: 500; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgb(34 197 94 / .3); }
  .photo {
    width: 330px; height: 400px; border-radius: 14px; overflow: hidden;
    border: 1.5px solid var(--border); background: var(--card); padding: 10px;
    box-shadow: 0 18px 40px rgb(29 33 48 / .14); transform: rotate(2deg);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <svg class="bg" width="760" height="630" viewBox="0 0 760 630">
    <polygon points="0,630 0,520 60,500 120,515 180,470 240,480 300,430 360,445 420,390 480,400 540,340 600,355 660,300 720,280 760,290 760,630" fill="#b4521c" opacity=".07"/>
    <polyline points="0,520 60,500 120,515 180,470 240,480 300,430 360,445 420,390 480,400 540,340 600,355 660,300 720,280 760,290" fill="none" stroke="#b4521c" stroke-width="3" opacity=".3"/>
  </svg>
  <div class="wrap">
    <div class="left">
      <div class="logo">harsh<span>.py</span></div>
      <h1>Harsh Gupta</h1>
      <div class="role">Data &amp; BI Analyst · Dublin, IE</div>
      <div class="kpis">
        <div class="kpi"><b>5+</b><small>yrs experience</small></div>
        <div class="kpi"><b>7</b><small>projects</small></div>
        <div class="kpi"><b>PL-300</b><small>certified</small></div>
      </div>
      <div class="foot">
        <span class="pill"><span class="dot"></span>Open to work</span>
        <span>Power BI · DAX · SQL · Python</span>
      </div>
    </div>
    <div class="photo"><img src="../../src/assets/harsh-portrait.jpg" alt=""></div>
  </div>
  <div class="bar"></div>
</body>
</html>
